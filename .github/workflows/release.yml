name: Release

on:
  push:
    branches: ["main"]

# contents 用于建 tag + GitHub Release；packages 用于推 GHCR Docker 镜像。
permissions:
  contents: read

jobs:
  # 门：发布前再跑一遍测试，红则不发。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: python -m pytest -q

  release:
    runs-on: ubuntu-latest
    needs: verify
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Setup | Checkout on release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup | Force release branch to workflow sha
        run: git reset --hard ${{ github.sha }}

      - name: Action | Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish | Upload dist + notes to GitHub Release
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Publish | Apply curated bilingual release notes
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python tools/release_notes.py check "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --notes-file "docs/release-notes/$RELEASE_TAG.md"

      - name: Docker | Checkout released tag
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Docker | Set up Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker | Login to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker | Metadata
        if: steps.release.outputs.released == 'true'
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/seasontemple/transmutary
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest

      - name: Docker | Build and push GHCR image
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
